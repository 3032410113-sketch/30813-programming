<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>웹프로그래밍 수행평가</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background-color: #f2f4f6;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin-bottom: 10px;
        }

        header p {
            color: #666;
        }

        .section {
            background-color: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;

            background-color: #333;
            color: white;

            text-align: center;
            text-decoration: none;

            border-radius: 10px;
            font-size: 16px;
        }

        .button:hover {
            background-color: #555;
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>웹프로그래밍 수행평가</h1>
        <p>30813 심현덕</p>
    </header>


    <!-- 문항 제작 -->
    <div class="section">

        <h2>문항 제작</h2>

        <a class="button" href="문항제작(1).PDF">
            문항 제작 (1)
        </a>

        <a class="button" href="문항제작(2).PDF">
            문항 제작 (2)
        </a>

        <a class="button" href="문항제작(3).PDF">
            문항 제작 (3)
        </a>

        <a class="button" href="문항제작(4).PDF">
            문항 제작 (4)
        </a>

    </div>


    <!-- 프로그래밍 프로젝트 -->
    <div class="section">

        <h2>프로그래밍 프로젝트</h2>

        <a class="button" href="프로그래밍프로젝트(1).PDF">
            프로그래밍 프로젝트 (1)
        </a>

        <a class="button" href="프로그래밍프로젝트(2).PDF">
            프로그래밍 프로젝트 (2)
        </a>

    </div>


    <!-- 데이터 시각화 -->
    <div class="section">

        <h2>데이터 시각화</h2>

        <a class="button" href="데이터시각화.PDF">
            데이터 시각화 결과물
        </a>

    </div>


    <footer>
        웹프로그래밍 수행평가 결과물
    </footer>

</div>

</body>
</html>
